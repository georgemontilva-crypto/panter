# Compila el instalador de Windows del programa de bloqueo y lo publica en Releases.
# Corre solo cuando cambia algo dentro de agente-pc/, o a mano desde la pestaña Actions.
name: Instalador del programa de bloqueo

on:
  push:
    branches: [main]
    paths:
      - "agente-pc/**"
      - ".github/workflows/agente-pc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agente-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Compilar el guardia de teclado
        shell: pwsh
        run: |
          # csc viene con Windows (.NET Framework 4): no hace falta instalar nada.
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:exe /out:keyblock.exe keyblock.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Prueba mínima: debe arrancar, avisar "ready" y terminar al recibir "quit".
          $salida = "quit" | .\keyblock.exe
          Write-Host "keyblock respondió: '$salida' (código $LASTEXITCODE)"
          if ($salida -notmatch "ready") {
            if ($LASTEXITCODE -eq 2) { Write-Warning "El gancho no se pudo instalar en esta máquina de compilación (no tiene escritorio interactivo)." }
            else { Write-Error "keyblock no arrancó bien."; exit 1 }
          }
          exit 0
      - name: Compilar el instalador
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Comprobar que el guardia de teclado va dentro del instalador
        shell: pwsh
        run: |
          $ruta = "dist\win-unpacked\resources\keyblock.exe"
          if (-not (Test-Path $ruta)) { Write-Error "keyblock.exe no quedó empaquetado en $ruta"; exit 1 }
          Write-Host "keyblock.exe empaquetado: $((Get-Item $ruta).Length) bytes"
      - name: Autoprueba en Windows (bloqueo, sesión con pantalla de juegos, limpieza y cierre con la clave)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "panter-selftest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          # Clave de mantenimiento de prueba: 1234
          $pinHash = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes("1234"))).Replace("-", "").ToLower()
          @{ serverUrl = "http://127.0.0.1:47811"; token = "pc_SELFTEST"; pinHash = $pinHash } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $dir "config.json")
          # PC de mentira: Steam, Epic y Discord simulados dentro de esta carpeta (la arma el servidor de prueba).
          $env:PANTER_FIXTURES = Join-Path $env:RUNNER_TEMP "panter-pc-simulada"
          $server = Start-Process node -ArgumentList "selftest-server.js" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $env:PANTER_CONFIG_DIR = $dir
          $env:PANTER_SELFTEST = "1"
          $app = Start-Process "dist\win-unpacked\Panter Bloqueo.exe" -PassThru
          $cerro = $app.WaitForExit(110000)
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path (Join-Path $dir "selftest.json")) { Write-Host "--- selftest.json ---"; Get-Content (Join-Path $dir "selftest.json") }
          if (Test-Path (Join-Path $dir "error.log")) { Write-Host "--- error.log ---"; Get-Content (Join-Path $dir "error.log") }
          if (-not $cerro) {
            Get-Process "Panter Bloqueo", "keyblock", "juego-de-prueba", "cs2" -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Error "El programa NO se cerró con la clave de mantenimiento."
            exit 1
          }
          Write-Host "El programa se cerró con código $($app.ExitCode)."
          Start-Sleep -Seconds 2
          $quedan = Get-Process "Panter Bloqueo", "keyblock" -ErrorAction SilentlyContinue
          if ($quedan) { $quedan | Format-Table Name, Id; Write-Error "Quedaron procesos vivos después de cerrar."; exit 1 }
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System" /v DisableTaskMgr 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error "La política que quita el Administrador de tareas siguió puesta después de cerrar."; exit 1 }
          Write-Host "Políticas de Windows retiradas al cerrar."
          if (-not (Test-Path (Join-Path $dir "selftest.json"))) { Write-Error "La autoprueba no dejó su informe."; exit 1 }
          $informe = Get-Content (Join-Path $dir "selftest.json") -Raw | ConvertFrom-Json
          $sueltos = Get-Process "juego-de-prueba", "cs2" -ErrorAction SilentlyContinue
          if ($sueltos) { $sueltos | Stop-Process -Force; Write-Error "Quedaron juegos de prueba abiertos después de terminar la sesión."; exit 1 }
          if ($informe.fallas.Count -gt 0) {
            $informe.fallas | ForEach-Object { Write-Host "FALLA: $_" }
            Write-Error "La autoprueba encontró $($informe.fallas.Count) falla(s)."
            exit 1
          }
          Write-Host "Autoprueba sin fallas."
          if ($app.ExitCode -ne 0) { exit 1 }
          exit 0
      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="agente-v$VERSION"
          FILE="dist/Panter-Bloqueo-Setup-$VERSION.exe"
          ls -la dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Panter Bloqueo $VERSION" \
              --notes "Instalador del programa de bloqueo para las PC de la arena. Pasos de instalación: agente-pc/README.md"
          fi
          gh release upload "$TAG" "$FILE" --clobber
